[project]
name = "forge-poller"
version = "0.1.0"
description = "Polling bridge that forwards Jira/GitHub events to the Forge webhook gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
poller = "poller.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poller"]

[tool.ruff]
line-length = 100
